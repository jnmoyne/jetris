# Release pipeline: push a tag matching v* (e.g. v0.1.0) and this workflow
# builds the jetris binary for every supported platform, publishes a GitHub
# release with the archives and a SHA256SUMS file, and deploys the browser
# (WebAssembly) build to GitHub Pages at https://jnmoyne.github.io/jetris/.
#
# Gio (gioui.org) constrains how we build:
#   - Linux: cgo against X11/Wayland/EGL headers, so the build must run on a
#     Linux runner with the dev packages installed (no cross-compiling).
#   - macOS: cgo against Apple frameworks, so it must build on a macOS runner.
#     Both arm64 and amd64 build there (the SDK is multi-arch).
#   - Windows: pure Go (win32 syscalls), CGO_ENABLED=0.
#   - Browser: GOOS=js GOARCH=wasm, no cgo, any runner (scripts/build-wasm.sh).
# linux/arm64 builds on ubuntu-24.04-arm, which requires the repo to be public
# (GitHub's free arm64 runners are public-repo only).
#
# The browser build is attached to the release as jetris-<tag>-web.tar.gz (for
# self-hosting) and, once the release is published, deployed to GitHub Pages.
# One-time repository setup for that deploy:
#   - Settings > Pages: source "GitHub Actions".
#   - The github-pages environment must allow deployments from tags: under its
#     "Deployment branches and tags", add a tag rule "v*" (the default policy
#     only allows the default branch, and this workflow runs on tags).
#
# Every Go job downloads the module graph in a step of its own, retried, before
# it builds or tests anything. A release fans out over seven runners and any one
# of them can lose a coin flip with the module proxy — v0.11.1's darwin/arm64
# build died on "github.com/klauspost/compress@v1.19.2: ... net/http: TLS
# handshake timeout" while the other six were fine — and with the download
# folded into `go build` that one blip fails the whole release, artifacts and
# Pages deploy included, until someone re-runs the job by hand. Pulled out and
# retried, a blip costs ten seconds instead.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Download modules
        shell: bash
        run: |
          # The module proxy is a network service and occasionally times out on
          # one runner. Retry rather than lose a release to it.
          for attempt in 1 2 3; do
            if go mod download; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then
              echo "go mod download failed (attempt $attempt of 3); retrying in $((attempt * 10))s"
              sleep $((attempt * 10))
            fi
          done
          echo "go mod download failed three times — the module proxy is not reachable from this runner"
          exit 1
      - name: Install Gio build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config libwayland-dev libx11-dev \
            libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev \
            libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev
      - run: go test ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  goos: linux,   goarch: amd64, cgo: 1 }
          - { os: ubuntu-24.04-arm, goos: linux, goarch: arm64, cgo: 1 }
          - { os: macos-latest,   goos: darwin,  goarch: arm64, cgo: 1 }
          - { os: macos-latest,   goos: darwin,  goarch: amd64, cgo: 1 }
          - { os: windows-latest, goos: windows, goarch: amd64, cgo: 0 }
          - { os: windows-latest, goos: windows, goarch: arm64, cgo: 0 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Download modules
        shell: bash
        run: |
          # The module proxy is a network service and occasionally times out on
          # one runner. Retry rather than lose a release to it.
          for attempt in 1 2 3; do
            if go mod download; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then
              echo "go mod download failed (attempt $attempt of 3); retrying in $((attempt * 10))s"
              sleep $((attempt * 10))
            fi
          done
          echo "go mod download failed three times — the module proxy is not reachable from this runner"
          exit 1
      - name: Install Gio build dependencies
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config libwayland-dev libx11-dev \
            libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev \
            libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev
      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          go build -trimpath \
            -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o "jetris${ext}" ./cmd/jetris
      - name: Package
        shell: bash
        run: |
          name="jetris-${GITHUB_REF_NAME}-${{ matrix.goos }}-${{ matrix.goarch }}"
          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then ext=".exe"; fi
          mkdir "$name"
          mv "jetris${ext}" "$name/"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            7z a "${name}.zip" "$name"
          else
            tar czf "${name}.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: jetris-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            *.tar.gz
            *.zip
          if-no-files-found: error

  web:
    name: Build browser (wasm)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Download modules
        shell: bash
        run: |
          # The module proxy is a network service and occasionally times out on
          # one runner. Retry rather than lose a release to it.
          for attempt in 1 2 3; do
            if go mod download; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then
              echo "go mod download failed (attempt $attempt of 3); retrying in $((attempt * 10))s"
              sleep $((attempt * 10))
            fi
          done
          echo "go mod download failed three times — the module proxy is not reachable from this runner"
          exit 1
      - name: Build
        run: VERSION="${GITHUB_REF_NAME}" ./scripts/build-wasm.sh
      - name: Package
        run: |
          name="jetris-${GITHUB_REF_NAME}-web"
          cp -r dist/web "$name"
          tar czf "${name}.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: jetris-web
          path: "*.tar.gz"
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web

  release:
    name: Publish release
    needs: [build, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: jetris-*
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  pages:
    name: Deploy GitHub Pages
    needs: [web, release]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
