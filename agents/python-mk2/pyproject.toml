[project]
name = "python-mk2"
version = "0.1.0"
description = "A Jetris agent in Python: the golang-mk2 coordinating agent, ported"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["nats-py>=2.16"]

[project.optional-dependencies]
nkeys = ["nkeys>=0.2"]

[project.scripts]
python-mk2 = "python_mk2.main:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python_mk2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
